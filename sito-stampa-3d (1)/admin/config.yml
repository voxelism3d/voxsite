backend:
  name: github
  repo: TUO-UTENTE-GITHUB/NOME-REPOSITORY
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
locale: it
collections:
  - name: sito
    label: Impostazioni del sito
    files:
      - name: sito
        label: Testi e contatti
        file: content/site.json
        fields:
          - { label: "Nome del brand", name: brand, widget: string }
          - { label: "Titolo principale", name: hero_title, widget: string, hint: "L'ultima parola appare colorata" }
          - { label: "Testo sotto il titolo", name: hero_text, widget: text }
          - { label: "Email", name: email, widget: string }
          - { label: "Link negozio Etsy", name: etsy_url, widget: string, required: false }
          - { label: "Link Instagram", name: instagram_url, widget: string, required: false }
          - { label: "Video showreel", name: showreel, widget: file, required: false, hint: "MP4 breve e compresso" }
          - label: "Numeri in evidenza"
            name: stats
            widget: list
            fields:
              - { label: "Numero", name: numero, widget: number, value_type: int }
              - { label: "Etichetta", name: etichetta, widget: string }
          - { label: "Materiali", name: materiali, widget: list, field: { label: "Materiale", name: m, widget: string } }
      - name: lavori
        label: I miei lavori
        file: content/works.json
        fields:
          - label: "Lavori"
            name: items
            widget: list
            summary: "{{fields.titolo}}"
            fields:
              - { label: "Titolo", name: titolo, widget: string }
              - { label: "Descrizione", name: descrizione, widget: text }
              - { label: "Materiale", name: materiale, widget: string, required: false }
              - { label: "Foto", name: immagine, widget: image, required: false }
              - { label: "Link Etsy del prodotto", name: etsy_url, widget: string, required: false }
